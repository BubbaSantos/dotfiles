# Extra env variables
# env = MY_GLOBAL_ENV,setting
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

env = LIBVA_DRIVER_NAME,iHD
env = LIBVA_DRM_DEVICE,/dev/dri/renderD129

# browser-picker: everything goes to Vivaldi via a catch-all rule, so don't
# let it auto-discover/add other browsers or profiles into browsers.conf
env = BROWSER_PICKER_AUTO_RESCAN,0

