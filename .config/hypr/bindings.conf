# =============================================================================
# VARIABLES
# =============================================================================

$terminal = uwsm-app -- alacritty
#$terminal = uwsm-app -- kitty
$browser  = omarchy-launch-browser
$webapp   = chromium --app


# =============================================================================
# UNBINDS
# =============================================================================

unbind = SUPER, A
unbind = SUPER, W
unbind = SUPER, F
unbind = SUPER CTRL, F
unbind = SUPER, J
unbind = SUPER, P
unbind = SUPER, O
unbind = SUPER ALT, F
unbind = SUPER, TAB
unbind = SUPER CTRL, TAB
unbind = , PRINT
unbind = SHIFT, PRINT
unbind = SUPER, T
unbind = SUPER CTRL, T
unbind = SUPER CTRL, B
unbind = SUPER, Y
unbind = SUPER, L
unbind = SUPER, K
unbind = SUPER, backslash
unbind = SUPER, SLASH
unbind = SUPER, Z
unbind = SUPER, COMMA
unbind = SUPER SHIFT, COMMA
unbindd = SUPER CTRL, SPACE
unbindd = SUPER CTRL, V
unbind = SUPER CTRL, S
unbind = SUPER, S
unbind = SUPER CTRL, C
unbind = SUPER, code:61
unbind = SUPER ALT, code:61
unbind = SUPER CTRL, W
unbind = CTRL SUPER, left
unbind = CTRL SUPER, right
unbind = SUPER CTRL, PERIOD
unbind = SUPER SHIFT, SPACE
# Was Omarchy's default "Launch apps" (omarchy-launch-walker) — replaced by
# quickshell's own native AppLauncher, see the QUICKSHELL section below.
unbind = SUPER, SPACE
unbind = SUPER CTRL ALT, Z
unbind = SUPER CTRL, Z
unbind = SUPER CTRL, E
unbind = SUPER CTRL, I

# Audio key overrides (replace swayosd-client with direct wpctl calls)
unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
unbind = , XF86AudioMute
unbind = ALT, XF86AudioRaiseVolume
unbind = ALT, XF86AudioLowerVolume


# =============================================================================
# FUNCTION KEYS (Thinkpad)
# =============================================================================

# Brightness (F5/F6)
bindeld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 5%-
bindeld = , XF86MonBrightnessUp,   Brightness up,   exec, brightnessctl set 5%+
bind    = , XF86MonBrightnessDown, global, quickshell:showBrightnessOSD
bind    = , XF86MonBrightnessUp,   global, quickshell:showBrightnessOSD

# F8 (WiFi) and F10 (BT) use F20/F21 keycodes to avoid kernel rfkill toggling.
# Requires /etc/udev/hwdb.d/99-thinkpad-fn-keys.hwdb to remap the scan codes.
bind = , F20,          global, quickshell:toggleWifiPicker
bind = , XF86Tools,    global, quickshell:toggleSettings
bind = , F21,          global, quickshell:toggleBluetoothPicker
bind = , XF86Keyboard, global, quickshell:toggleControlCenter


# =============================================================================
# APPLICATIONS — Launchers & Core
# =============================================================================

bindd = SUPER, RETURN,       Terminal,          exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Floating Terminal, exec, alacritty --class floating-terminal
bindd = SUPER ALT, RETURN,   Tmux,              exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
bindd = SUPER, E,            File Manager,      exec, uwsm-app -- nautilus --new-window
bindd = SUPER, B,            Browser,           exec, vivaldi --ozone-platform-hint=auto --enable-features=TouchpadOverscrollHistoryNavigation
#bindd = SUPER, B, Zen, exec, zen-browser
bindd = SUPER SHIFT, L,      Editor,            exec, omarchy-launch-editor


# =============================================================================
# APPLICATIONS — Web Apps
# =============================================================================

bindd = SUPER, A,       Claude,   exec, $webapp="https://claude.ai/new"
#bindd = SUPER, A, Claude, exec, firefoxpwa site launch 01KGTGYTMPGTYGVTXRQ9ART9SH
bindd = SUPER, Z,       ChatGPT,  exec, $webapp="https://chatgpt.com"
bind  = SUPER SHIFT, I,           exec, $webapp="https://fitbapredictor.xyz"


# =============================================================================
# APPLICATIONS — Toggle Apps
# =============================================================================

bindd = SUPER, H,       Toggle Hotmail, exec, ~/.local/bin/toggle-hotmail
bindd = SUPER SHIFT, H, Toggle Gmail,   exec, ~/.local/bin/toggle-gmail
bind  = SUPER, L,                       exec, localsend
bind  = SUPER, O,                       exec, ~/.local/bin/toggle-outlook.sh
#bind = SUPER SHIFT, B, exec, $webapp="https://outlook.office.com/calendar/view/workweek"
bind  = SUPER, R,                       exec, ~/.local/bin/toggle-reddit.sh
bind  = SUPER, W,                       exec, ~/.local/bin/whatsapp-toggle.sh
bind  = SUPER, Y,                       exec, ~/.local/bin/youtube-toggle
bind  = SUPER SHIFT, F,                 exec, ~/.local/bin/toggle-fotmob.sh
bind  = SUPER SHIFT, J,                 exec, ~/.local/bin/toggle-jellyfin.sh
bind  = SUPER SHIFT, M,                 exec, ~/.local/bin/toggle-ytmusic.sh
bind  = SUPER SHIFT, N,                 exec, ~/.local/bin/toggle-notion.sh
#bind = SUPER SHIFT, N, exec, $webapp="https://notion.so"
#bind  = SUPER SHIFT, P,                 exec, ~/.local/bin/patreon-toggle
bind  = SUPER SHIFT, R,                 exec, ~/.local/bin/toggle-remmina.sh
bind  = SUPER SHIFT, S,                 exec, steam
bind  = SUPER SHIFT, T,                 exec, ~/.local/bin/toggle-teams-linux.sh
bind  = ALT, C,                         exec, ~/.local/bin/toggle-calculator
#bind = SUPER, U, exec, ~/.local/bin/toggle-todo.sh
#bind = SUPER, X, exec, ~/.local/bin/toggle-x.sh


# =============================================================================
# WINDOW MANAGEMENT
# =============================================================================

bind  = SUPER, Q,          killactive
bind  = SUPER, F,          fullscreen, 1
bind  = SUPER, Home,       fullscreen, 1
bindd = SUPER, J,          Toggle window split,           layoutmsg, togglesplit
bindd = SUPER, backslash,  Toggle window floating/tiling, exec, ~/.local/bin/toggle-float-resize
bindd = SUPER CTRL, O,     Pop window out (float & pin),  exec, omarchy-hyprland-window-pop
bindd = SUPER CTRL ALT, G, Lock active group,              lockactivegroup, toggle
bind  = SUPER, D,          exec, alacritty --class hypr-split-ratio --option font.size=12 -e ~/.local/bin/hypr-split-ratio
bind  = SUPER SHIFT, O,    exec, alacritty --class opacity-picker -e ~/.local/bin/opacity-picker


# =============================================================================
# WORKSPACES
# =============================================================================

bind  = SUPER_CTRL, left,  workspace, -1
bind  = SUPER_CTRL, right, workspace, +1
bindd = SUPER, TAB,        Former workspace,   workspace, previous
bindd = SUPER CTRL, TAB,   Next workspace,      workspace, e+1
bindd = SUPER SHIFT, TAB,  Previous workspace,  workspace, e-1
bind  = , mouse:278,       workspace, previous
#bind  = , mouse:278, exec, ~/.local/bin/mouse-btn-handy press
#bindr = , mouse:278, exec, ~/.local/bin/mouse-btn-handy release

# Special workspace toggles
bind = ALT, 1, togglespecialworkspace, special 1
bind = ALT, 2, togglespecialworkspace, special 2
bind = ALT, 3, togglespecialworkspace, special 3
bind = ALT, 4, togglespecialworkspace, special 4
bind = ALT, 5, togglespecialworkspace, special 5
bind = ALT, 6, togglespecialworkspace, special 6
bind = ALT, 7, togglespecialworkspace, special 7
bind = ALT, 8, togglespecialworkspace, special 8
bind = ALT, 9, togglespecialworkspace, special 9

# Special workspace moves
bind = ALT SHIFT, 1, movetoworkspacesilent, special:special 1
bind = ALT SHIFT, 2, movetoworkspacesilent, special:special 2
bind = ALT SHIFT, 3, movetoworkspacesilent, special:special 3
bind = ALT SHIFT, 4, movetoworkspacesilent, special:special 4
bind = ALT SHIFT, 5, movetoworkspacesilent, special:special 5
bind = ALT SHIFT, 6, movetoworkspacesilent, special:special 6
bind = ALT SHIFT, 7, movetoworkspacesilent, special:special 7
bind = ALT SHIFT, 8, movetoworkspacesilent, special:special 8
bind = ALT SHIFT, 9, movetoworkspacesilent, special:special 9

# Close workspaces
bind = CTRL SHIFT, Delete,     exec, ~/.local/bin/close_other_workspaces.sh
bind = CTRL SHIFT ALT, Delete, exec, alacritty --class close-selected-workspaces --option font.size=11 -e ~/.local/bin/close_selected_workspaces.sh


# =============================================================================
# QUICKSHELL
# =============================================================================

bind = SUPER, SPACE,        global, quickshell:toggleAppLauncher
bind = SUPER SHIFT, SPACE,  global, quickshell:toggleBar
bind = SUPER, COMMA,        global, quickshell:snoozeToast
bind = SUPER SHIFT, COMMA,  global, quickshell:dismissToast
bind = SUPER SHIFT, period, global, quickshell:nextWallpaper
bind = SUPER SHIFT, comma,  global, quickshell:previousWallpaper
bind = SUPER CTRL, SPACE,   global, quickshell:toggleWallpaperPicker
bind = SUPER CTRL ALT, SPACE, global, quickshell:nextWallpaperInFolder
#bindd = SUPER CTRL, SPACE, awww background changer, exec, ~/.local/bin/omarchy-theme-bg-next
bind = SUPER CTRL, B,        global, quickshell:togglePowerMenu
# Was Omarchy's default "System menu" (omarchy-menu system) — still reachable via `omarchy menu system`.
unbind = SUPER, ESCAPE
bind = SUPER, Escape,        global, quickshell:togglePowerOptions
bind = SUPER CTRL, W,        global, quickshell:toggleWifiPicker
bind = SUPER CTRL SHIFT, B,  global, quickshell:toggleBluetoothPicker
bind = SUPER, K,             global, quickshell:toggleControlCenter
bind = SUPER, U,             global, quickshell:toggleTasks
bind = SUPER, M,             global, quickshell:toggleMediaPlayer
bind = SUPER, T,             global, quickshell:toggleBigCalendar
bind = ALT, W,               global, quickshell:toggleWeeklySummary
bind = SUPER, N,             global, quickshell:toggleNotifHub
bind = SUPER CTRL, E,        global, quickshell:toggleNextAppointments
bind = SUPER, S,             global, quickshell:quickSendClipboard
bind = ALT, F,               global, quickshell:toggleSpfl
bind = ALT, N,               global, quickshell:toggleNextMatch
bind = SUPER CTRL, S,        global, quickshell:toggleScripts
bind = SUPER ALT, T,         global, quickshell:toggleTimepieces
bind = SUPER, END,           exec, ~/.local/bin/qs-restart
# =============================================================================
# CLIPBOARD & TYPING
# =============================================================================

bind = , grave,       exec, ~/.local/bin/backtick_handler.sh
bind = CTRL, grave,   exec, ~/.local/bin/paste_handler.sh
bind = SHIFT, grave,  exec, ~/.local/bin/clipse-pick.sh
bind = SUPER CTRL, V, exec, ~/.local/bin/clipse-pick.sh
bind = SUPER, grave,  exec, ~/.local/bin/type-clipboard.sh

# Unbind Omarchy default SUPER+V (was: Universal paste via Shift+Insert, which fails for images)
unbind = SUPER, V
bindd = SUPER, V, Universal paste, exec, ~/.local/bin/universal-paste.sh

# Unbind Omarchy default SUPER+C (was: Universal copy via Ctrl+Insert, which Outlook web ignores)
unbind = SUPER, C
bindd = SUPER, C, Universal copy, exec, ~/.local/bin/universal-copy.sh


# =============================================================================
# SPEECH & DICTATION
# =============================================================================

# hyprwhspr - Toggle mode: press once to start, press again to stop
bindd = SUPER ALT, D, Speech-to-text, exec, /usr/lib/hyprwhspr/config/hyprland/hyprwhspr-tray.sh record

# Handy
# Unbind Omarchy default SUPER+X (was: Universal cut via Ctrl+X)
unbind = SUPER, X
bind = SUPER, X,       exec, pkill -USR2 -x handy
bind = SUPER SHIFT, X, exec, handy --toggle-post-process
#bind = SUPER, X, exec, notify-send -a handy -t 2000 "Handy" "Dictation" && pkill -USR2 -x handy
#bind = SUPER SHIFT, X, exec, notify-send -a handy -t 2000 "Handy" "AI post-processing" && handy --toggle-post-process

bind  = , mouse:277, exec, ~/.local/bin/mouse-btn-277 press
bindr = , mouse:277, exec, ~/.local/bin/mouse-btn-277 release


# =============================================================================
# SCREENSHOTS
# =============================================================================

bind = , Print,             exec, bash -c 'qs ipc -c "QuickShell Bar" call screenshot begin; FILE=~/Pictures/Screenshots/fullscreen-$(date +%s).png; grim - | tee "$FILE" | wl-copy; qs ipc -c "QuickShell Bar" call screenshot end; ACTION=$(notify-send -r 900001 -t 20000 -a "Screenshot" -A "default=Open" "Fullscreen" "$FILE"); [ "$ACTION" = "default" ] && satty -f "$FILE"'
bind = CTRL, Print,         exec, bash -c 'qs ipc -c "QuickShell Bar" call screenshot begin; FILE=~/Pictures/Screenshots/window-$(date +%s).png; AT=$(hyprctl activewindow | grep "at:" | awk "{print \$2}") && SIZE=$(hyprctl activewindow | grep "size:" | awk "{print \$2}" | sed "s/,/x/") && grim -g "${AT} ${SIZE}" - | tee "$FILE" | wl-copy; qs ipc -c "QuickShell Bar" call screenshot end; ACTION=$(notify-send -r 900002 -t 20000 -a "Screenshot" -A "default=Open" "Window" "$FILE"); [ "$ACTION" = "default" ] && satty -f "$FILE"'
bind = SHIFT, Print,        exec, bash -c 'qs ipc -c "QuickShell Bar" call screenshot begin; FILE=~/Pictures/Screenshots/region-$(date +%s).png; grim -g "$(slurp)" - | tee "$FILE" | wl-copy; qs ipc -c "QuickShell Bar" call screenshot end; ACTION=$(notify-send -r 900003 -t 20000 -a "Screenshot" -A "default=Open" "Region" "$FILE"); [ "$ACTION" = "default" ] && satty -f "$FILE"'
bind = SUPER SHIFT, Print,  exec, ~/.local/bin/region-to-lens


# =============================================================================
# WEBCAM
# =============================================================================

bind = SUPER ALT, C, exec, /usr/bin/cheese


# =============================================================================
# TEXT FORMATTING
# =============================================================================

bind = SUPER, period,      exec, ~/.local/bin/jome-emoji-picker
bind = SUPER, slash,       exec, ~/.local/bin/snippet-picker
bind = SUPER CTRL, slash,  exec, ~/.local/bin/text-format-picker-launch
bind = SUPER SHIFT, slash, exec, ~/.local/bin/format-strip-sentence
bind = SUPER CTRL, T,      global, quickshell:toggleCalendar

# Emergency kill for runaway wtype/ydotool (Handy, format picker, etc.)
bind = CTRL, Delete, exec, pkill -9 wtype; pkill -9 ydotool; notify-send "wtype + ydotool killed" -t 1500


# =============================================================================
# SYSTEM & UTILITIES
# =============================================================================

bind = SUPER, P,             exec, ~/.local/bin/midas-log
bind = SUPER SHIFT, P,             exec, ~/.local/bin/cara-log
bind = SUPER CTRL, D,        exec, alacritty --class date-duration --option font.size=10 -e ~/.local/bin/date-duration
bind  = SUPER CTRL, I,        exec, ~/.local/bin/toggle-income-protection-calc
bind = SUPER, bracketright,  exec, ~/.local/bin/cursor-magnify-toggle.sh
bind = SUPER SHIFT, W,       exec, ~/.local/bin/work-workflow.sh
bind = ALT, X,               exec, ~/scripts/google-search-selected.sh


# =============================================================================
# CONFIG EDITING
# =============================================================================

bind  = SUPER CTRL, C,  exec, omarchy-launch-tui /home/bubba/.local/bin/edit-hypr-config
bind  = SUPER SHIFT, C, exec, omarchy-launch-tui /home/bubba/.local/bin/edit-hypr-defaults
bindd = SUPER SHIFT, K, Show key bindings, exec, omarchy-menu-keybindings


# =============================================================================
# HARDWARE — Lid Switch
# =============================================================================

# Prevent screen blink on lid open/close
#bindl = , switch:on:Lid Switch,  exec, hyprctl dispatch dpms off
#bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on


# =============================================================================
# MEDIA KEYS
# =============================================================================

bindeld = , XF86AudioRaiseVolume,    Volume up,       exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume,    Volume down,     exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindeld = , XF86AudioMute,           Mute,            exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindeld = ALT, XF86AudioRaiseVolume, Volume up 1%,    exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 1%+
bindeld = ALT, XF86AudioLowerVolume, Volume down 1%,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
