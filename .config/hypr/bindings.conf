#Screen Capture
bind = , Print, exec, bash -c 'FILE=~/Pictures/Screenshots/fullscreen-$(date +%s).png; grim - | tee "$FILE" | wl-copy; ACTION=$(notify-send -a "Screenshot" -A "default=Open" "Fullscreen saved + copied"); [ "$ACTION" = "default" ] && satty -f "$FILE"'
bind = CTRL, Print, exec, bash -c 'FILE=~/Pictures/Screenshots/window-$(date +%s).png; AT=$(hyprctl activewindow | grep "at:" | awk "{print \$2}") && SIZE=$(hyprctl activewindow | grep "size:" | awk "{print \$2}" | sed "s/,/x/") && grim -g "${AT} ${SIZE}" - | tee "$FILE" | wl-copy; ACTION=$(notify-send -a "Screenshot" -A "default=Open" "Window saved + copied"); [ "$ACTION" = "default" ] && satty -f "$FILE"'
bind = SHIFT, Print, exec, bash -c 'FILE=~/Pictures/Screenshots/region-$(date +%s).png; grim -g "$(slurp)" - | tee "$FILE" | wl-copy; ACTION=$(notify-send -a "Screenshot" -A "default=Open" "Region saved + copied"); [ "$ACTION" = "default" ] && satty -f "$FILE"'
bind = SUPER SHIFT, Print, exec, ~/.local/bin/region-to-lens

