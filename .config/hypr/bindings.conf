# Brightness (F5/F6)
bindeld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 5%-
bindeld = , XF86MonBrightnessUp,   Brightness up,   exec, brightnessctl set 5%+
bind   = , XF86MonBrightnessDown, global, quickshell:showBrightnessOSD
bind   = , XF86MonBrightnessUp,   global, quickshell:showBrightnessOSD

# Function key → QuickShell (F8/F9/F10/F11)
# F8 (WiFi) and F10 (BT) use F20/F21 keycodes to avoid kernel rfkill toggling.
# Requires /etc/udev/hwdb.d/99-thinkpad-fn-keys.hwdb to remap the scan codes.
bind = , F20,       global, quickshell:toggleWifiPicker
bind = , XF86Tools, global, quickshell:toggleSettings
bind = , F21,       global, quickshell:toggleBluetoothPicker
bind = , XF86Keyboard,  global, quickshell:toggleControlCenter

# Audio key overrides (replace swayosd-client with direct wpctl calls)
unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
unbind = , XF86AudioMute
unbind = ALT, XF86AudioRaiseVolume
unbind = ALT, XF86AudioLowerVolume
bindeld = , XF86AudioRaiseVolume, Volume up,       exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Volume down,     exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindeld = , XF86AudioMute,        Mute,            exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindeld = ALT, XF86AudioRaiseVolume, Volume up 1%, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 1%+
bindeld = ALT, XF86AudioLowerVolume, Volume down 1%, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-

