# =============================================================================
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
# VARIABLES
# =============================================================================

$terminal = uwsm-app -- alacritty
$browser = omarchy-launch-browser
$webapp = chromium --app


# =============================================================================
# UNBINDS
# =============================================================================

unbind = ALT, TAB
unbind = SUPER, A
unbind = SUPER, F
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, mouse_down
unbind = SUPER, mouse_up
unbind = SUPER, O
unbind = SUPER, P
unbind = SUPER, S
unbind = SUPER, T
unbind = SUPER, TAB
unbind = SUPER, W
unbind = SUPER, Y
unbind = SUPER, Z
unbind = SUPER, \
unbind = SUPER CTRL, B
unbind = SUPER CTRL, F
unbind = SUPER CTRL, T
unbind = SUPER CTRL, TAB
unbind = SUPER CTRL, W
unbind = SUPER ALT, F
unbind = SUPER SHIFT CTRL, Space
unbind = , PRINT
unbind = SHIFT, PRINT
unbind = SUPER CTRL, C
unbind = SUPER, Slash
unbind = SUPER, L
unbind = SUPER CTRL, S
unbind = SUPER SHIFT, SPACE
unbind = SUPER CTRL, period
unbind = SUPER, code:61
unbind = SUPER ALT, code:61
unbind = SUPER CTRL, O
unbind = SUPER, COMMA
unbind = SUPER SHIFT, COMMA
unbind = SUPER CTRL, SPACE
unbind = SUPER CTRL, B
unbind = SUPER CTRL, W
unbind = SUPER CTRL SHIFT, B
unbind = SUPER, U
unbind = SUPER, M
unbind = SUPER, T
unbind = SUPER, N


# =============================================================================
# APPLICATIONS
# =============================================================================

# --- Launchers & Core ---
bindd = SUPER, RETURN,         Terminal,              exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN,   Floating Terminal,     exec, alacritty --class floating-terminal
bindd = SUPER, E,              File Manager,          exec, uwsm-app -- nautilus --new-window recent:///
bindd = SUPER, B,              Open browser,          exec, vivaldi --ozone-platform=wayland --enable-features=TouchpadOverscrollHistoryNavigation,UseOzonePlatform,WaylandWindowDecorations --force-device-scale-factor=1
bindd = SUPER SHIFT, SPACE,    Toggle top bar,        exec, ~/.local/bin/toggle-waybar

# --- Web Apps ---
bindd = SUPER, A,              Claude,                exec, $webapp="https://claude.ai/new"
bindd = SUPER, Z,              ChatGPT,               exec, chromium --disable-features=WebRtcAllowInputVolumeAdjustment,AutomaticGainControl --app="https://chatgpt.com"
#bindd = SUPER, U,              To Do,                 exec, $webapp="https://to-do.office.com/tasks/inbox"


# --- Toggle Apps ---
bind = SUPER, F,               exec, ~/.config/hypr/scripts/toggle-fotmob.sh
#bind = SUPER, K,               exec, ~/.config/hypr/scripts/keybr-toggle.sh
bind = SUPER, L,               exec, localsend
bind = SUPER SHIFT, M,               exec, ~/.config/hypr/scripts/toggle-ytmusic.sh
bind = SUPER SHIFT, N,               exec, ~/.config/hypr/scripts/toggle-notion.sh
bind = SUPER, O,               exec, ~/.config/hypr/scripts/toggle-outlook.sh
bind = SUPER, R,               exec, ~/.config/hypr/scripts/toggle-reddit.sh
bind = SUPER SHIFT, S,               exec, steam
bind = SUPER SHIFT, T,               exec, ~/.config/hypr/scripts/toggle-teams-linux.sh
bind = SUPER, W,               exec, ~/.config/hypr/scripts/whatsapp-toggle.sh
bind = SUPER, Y,               exec, ~/.config/hypr/scripts/youtube-toggle
bind = SUPER SHIFT, J,         exec, ~/.config/hypr/scripts/toggle-jellyfin.sh
#bind = SUPER SHIFT, N,         exec, xpad
bind = SUPER SHIFT, P,         exec, ~/.config/hypr/scripts/patreon-toggle
bind = SUPER SHIFT, R,         exec, ~/.config/hypr/scripts/toggle-remmina.sh
bind = SUPER SHIFT, S,         exec, gnome-sound-recorder
bind = , XF86Tools,            exec, ~/.config/hypr/scripts/toggle-calculator.sh
bind = ALT, C,                  exec, ~/.config/hypr/scripts/toggle-calculator.sh
bindd = SUPER, H, Toggle Hotmail, exec, ~/.local/bin/toggle-hotmail
bindd = SUPER SHIFT, H, Toggle Gmail, exec, ~/.local/bin/toggle-gmail

# =============================================================================
# WINDOW MANAGEMENT
# =============================================================================

bind = SUPER, Q,               killactive,
bind = SUPER, I,               exec, ~/.config/hypr/scripts/toggle-pin.sh
bind = SUPER, D,               exec, alacritty --class hypr-split-ratio --option font.size=12 -e ~/.local/bin/hypr-split-ratio
bindd = SUPER SHIFT, D, Toggle master/dwindle layout, exec, ~/.local/bin/hypr-toggle-layout
bind = SUPER, numbersign,      exec, ~/.config/hypr/scripts/toggle_float_tile.sh
bind = SUPER, backslash,       exec, ~/.config/hypr/scripts/float-size.sh
#bind = SUPER SHIFT, backslash, exec, omarchy-hyprland-window-single-square-aspect-toggle
bind = SUPER CTRL, backslash,  exec, ~/.local/bin/float-cycle-size.sh
#bind = SUPER SHIFT, T,         exec, hyprctl dispatch togglefloating && hyprctl dispatch resizeactive exact 1214 1246 && hyprctl dispatch centerwindow
bind = SUPER SHIFT, O, exec, alacritty --class opacity-picker -e ~/.local/bin/opacity-picker
bind = SUPER CTRL, F,          fullscreen, 1
bind = SUPER, Home,            fullscreen, 1
bindd = SUPER CTRL, O,         Pop window out (float & pin), exec, omarchy-hyprland-window-pop
bind = SUPER, J,               layoutmsg, togglesplit
bind = SUPER_CTRL, left,       workspace, -1
bind = SUPER_CTRL, right,      workspace, +1
bind = SUPER ALT CTRL, G,      lockactivegroup, toggle
bindd = ALT, TAB,              Next window in group,  changegroupactive, f
bindd = Mod5, TAB,             Next window in group,  changegroupactive, f
bindm = , mouse:274,           movewindow
bindd = SUPER, TAB,            Former workspace, workspace, previous

group {
  drag_into_group = 1
}

input {
    kb_options = compose:caps,lalt_equals_ralt
}

# ============================================================================
# QuickShell
# ============================================================================

bind = SUPER, COMMA,       global, quickshell:snoozeToast
bind = SUPER SHIFT, COMMA, global, quickshell:dismissToast
bind = SUPER CTRL, SPACE, global, quickshell:toggleWallpaperPicker
bind = SUPER SHIFT, period, global, quickshell:nextWallpaper
bind = SUPER CTRL, W, global, quickshell:toggleWifiPicker
bind = SUPER CTRL SHIFT, B, global, quickshell:toggleBluetoothPicker
bind = SUPER, K, global, quickshell:toggleControlCenter
bind = SUPER, U, global, quickshell:toggleTodos
bind = SUPER, M, global, quickshell:toggleMediaPlayer
bind = SUPER, T, global, quickshell:toggleCalendar
bind = SUPER, N, global, quickshell:toggleNotifHub




# =============================================================================
# CLIPBOARD & TYPING
# =============================================================================

bind = , grave,                exec, ~/.config/hypr/scripts/backtick_handler.sh
bind = CTRL, grave,            sendshortcut, SHIFT, Insert,
bind = SHIFT, grave,           exec, ~/.config/hypr/scripts/clipse-launch.sh
bind = SUPER, grave,           exec, ~/.local/bin/type-clipboard.sh
bind = SUPER CTRL, V,          exec, ~/.config/hypr/scripts/clipse-launch.sh


# =============================================================================
# SPEECH & DICTATION
# =============================================================================

bind = , F3,                   exec, ~/.local/bin/hyprwhspr-status.sh toggle-mute
#bind = SUPER, X,               exec, /usr/lib/hyprwhspr/config/hyprland/hyprwhspr-tray.sh record
bind = SUPER, X,               exec, pkill -USR2 -x handy
bind = SUPER SHIFT, X,         exec,  handy --toggle-post-process
# =============================================================================
# SCREENSHOTS
# =============================================================================

bind = CTRL, Print,  exec, ~/.local/bin/screenshot-window
bind = SHIFT, Print, exec, ~/.local/bin/screenshot-region
bind = , Print, exec, ~/.local/bin/screenshot-fullscreen
bind = SUPER SHIFT, Print,     exec, ~/.local/bin/region-to-lens


# =============================================================================
# MONITOR BRIGHTNESS
# =============================================================================

bind  = , F1,                  exec, sh -c "BRIGHTNESS_STEP=10 BRIGHTNESS_NOTIFY=0 $HOME/.local/bin/monitor-brightness down && hyprctl dispatch global quickshell:showBrightnessOSD"
bind  = , F2,                  exec, sh -c "BRIGHTNESS_STEP=10 BRIGHTNESS_NOTIFY=0 $HOME/.local/bin/monitor-brightness up && hyprctl dispatch global quickshell:showBrightnessOSD"
binde = SUPER, F1,             exec, sh -c "BRIGHTNESS_STEP=10 $HOME/.local/bin/monitor-brightness down & disown"
binde = SUPER, F2,             exec, sh -c "BRIGHTNESS_STEP=10 $HOME/.local/bin/monitor-brightness up & disown"
bind  = SUPER SHIFT, F1,       exec, sh -c "$HOME/.local/bin/monitor-brightness min & disown"
bind  = SUPER SHIFT, F2,       exec, sh -c "$HOME/.local/bin/monitor-brightness max & disown"



# =============================================================================
# LOGITECH BRIO WEBCAM
# =============================================================================

bind  = SUPER ALT, C,          exec, /usr/bin/cheese
bind  = SUPER ALT, F,          exec, ~/.local/bin/brio-cam.sh autofocus_toggle
binde = SUPER ALT, Right,      exec, ~/.local/bin/brio-cam.sh pan_left
binde = SUPER ALT, Left,       exec, ~/.local/bin/brio-cam.sh pan_right
binde = SUPER ALT, Down,       exec, ~/.local/bin/brio-cam.sh pan_up
binde = SUPER ALT, Up,         exec, ~/.local/bin/brio-cam.sh pan_down
binde = SUPER ALT, Page_Up,    exec, ~/.local/bin/brio-cam.sh zoom_in
binde = SUPER ALT, Page_Down,  exec, ~/.local/bin/brio-cam.sh zoom_out
binde = SUPER ALT, Home,       exec, ~/.local/bin/brio-cam.sh focus_far
binde = SUPER ALT, End,        exec, ~/.local/bin/brio-cam.sh focus_near


# =============================================================================
# SYSTEM & UTILITIES
# =============================================================================

bind = SUPER, P,               exec, ~/.config/hypr/scripts/midas-log
bind = SUPER, Page_Up,         exec, espanso restart
bind = SUPER, period,          exec, ~/.local/bin/jome-emoji-picker
bind = SUPER, slash,           exec, ~/.local/bin/snippet-picker
bind = SUPER ALT, W,           exec, /home/bubba/.local/bin/random-wallpaper
bind = SUPER SHIFT, W,         exec, ~/.local/bin/workflow-work
bind = ALT, X,                 exec, ~/.config/hypr/scripts/google-search-selected.sh
bind = SUPER SHIFT, Delete,    exec, sleep 0.3 && hyprctl dispatch dpms off
bind = SUPER SHIFT, apostrophe,      exec, ~/.local/bin/bubba-text-menu
bind = ALT, Space,             exec, omarchy-menu toggle
bind = SUPER CTRL, D, exec, alacritty --class  date-duration --option font.size=10 -e ~/.local/bin/date-duration
bind = SUPER SHIFT ALT, W, exec, alacritty --class hypr-window-info -e hypr-window-info --addr "$(hyprctl -j activewindow | jq -r .address)"
#bind = , mouse:277, exec, ~/.local/bin/mouse-btn-277
#bind = , mouse:276, exec, ~/.local/bin/mouse-btn-276
#bind = , mouse:275, exec, ~/.local/bin/mouse-btn-275

bind  = , mouse:278, exec, ~/.local/bin/mouse-btn-handy press
bindr = , mouse:278, exec, ~/.local/bin/mouse-btn-handy release

bind = , mouse:277, exec, ~/.local/bin/mouse-btn-277 press
bindr = , mouse:277, exec, ~/.local/bin/mouse-btn-277 release

bind = SUPER, bracketright, exec, ~/.config/hypr/scripts/cursor-magnify-toggle.sh

# =============================================================================
# TEXT FORMATTING
# =============================================================================
bind = SUPER CTRL, slash,      exec, ~/.local/bin/text-format-picker-launch
#bind = SUPER CTRL, T,          exec, ~/.local/bin/format-title-case-launch
#bind = SUPER CTRL, S,          exec, ~/.local/bin/format-sentence-case-launch
bind = SUPER SHIFT, slash,     exec, ~/.local/bin/format-strip-sentence

# Emergency kill for runaway wtype/ydotool (Handy, format picker, etc.)
bind = CTRL, Delete, exec, pkill -9 wtype; pkill -9 ydotool; notify-send "wtype + ydotool killed" -t 1500

# =============================================================================
# CONFIG EDITING
# =============================================================================

bind = SUPER CTRL, C, exec, $terminal -e nvim ~/.config/hypr
bind = SUPER SHIFT, C, exec, $terminal -e nvim ~/.local/share/omarchy/default/hypr
#bind = SUPER CTRL, W,          exec, ~/.config/waybar/refresh-bars.sh
bindd = SUPER SHIFT, K,        Show key bindings, exec, omarchy-menu-keybindings


# =============================================================================
# HARDWARE
# =============================================================================

# Lid switch - prevent screen blink on lid open
bindl = , switch:on:Lid Switch,  exec, hyprctl dispatch dpms off
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on


# Zoom
bindd = SUPER SHIFT, Prior, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 0.5')
bindd = SUPER SHIFT, Next, Zoom out, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq 'if .float - 0.5 < 1 then 1 else .float - 0.5 end')
bindd = SUPER SHIFT, Home, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1
bindd = SUPER SHIFT, mouse_up, Zoom in (scroll), exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 0.25')
bindd = SUPER SHIFT, mouse_down, Zoom out (scroll), exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq 'if .float - 0.25 < 1 then 1 else .float - 0.25 end')
bindd = SUPER SHIFT, End, Toggle 2x zoom, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq 'if .float == 1 then 3 else 1 end')

# Hold-to-zoom: 2.5x while SUPER SHIFT A is held, reset on release
bindd = SUPER SHIFT, A, Hold zoom 2.5x, exec, hyprctl keyword cursor:zoom_factor 2.5
binddr = SUPER SHIFT, A, Release zoom, exec, hyprctl keyword cursor:zoom_factor 1

bind = SUPER SHIFT, z, exec, alacritty --class script-launcher --option font.size=9 --option window.dimensions.columns=100 --option window.dimensions.lines=30 -e ~/.local/bin/script-launcher


# =============================================================================
# MEDIA KEY OVERRIDES (replace swayosd with direct commands)
# =============================================================================

unbind = ,XF86AudioRaiseVolume
unbind = ,XF86AudioLowerVolume
unbind = ,XF86AudioMute
unbind = ALT,XF86AudioRaiseVolume
unbind = ALT,XF86AudioLowerVolume
unbind = ,XF86MonBrightnessUp
unbind = ,XF86MonBrightnessDown
unbind = SHIFT,XF86MonBrightnessUp
unbind = SHIFT,XF86MonBrightnessDown
unbind = ALT,XF86MonBrightnessUp
unbind = ALT,XF86MonBrightnessDown

bindeld = ,XF86AudioRaiseVolume,    Volume up,           exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = ,XF86AudioLowerVolume,    Volume down,         exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindeld = ,XF86AudioMute,           Mute,                exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindeld = ALT,XF86AudioRaiseVolume, Volume up precise,   exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 1%+
bindeld = ALT,XF86AudioLowerVolume, Volume down precise, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-

bindeld = ,XF86MonBrightnessUp,       Brightness up,      exec, brightnessctl set +5% && hyprctl dispatch global quickshell:showBrightnessOSD
bindeld = ,XF86MonBrightnessDown,     Brightness down,    exec, brightnessctl set 5%- && hyprctl dispatch global quickshell:showBrightnessOSD
bindeld = SHIFT,XF86MonBrightnessUp,  Brightness max,     exec, brightnessctl set 100% && hyprctl dispatch global quickshell:showBrightnessOSD
bindeld = SHIFT,XF86MonBrightnessDown,Brightness min,     exec, brightnessctl set 1% && hyprctl dispatch global quickshell:showBrightnessOSD
bindeld = ALT,XF86MonBrightnessUp,   Brightness up fine,  exec, brightnessctl set +1% && hyprctl dispatch global quickshell:showBrightnessOSD
bindeld = ALT,XF86MonBrightnessDown, Brightness down fine,exec, brightnessctl set 1%- && hyprctl dispatch global quickshell:showBrightnessOSD
